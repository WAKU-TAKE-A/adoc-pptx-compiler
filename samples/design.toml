# adoc-pptx-compiler デザイン設定のサンプル
# 使い方: python adoc-pptx-compiler.py 原稿.adoc 出力.pptx --design samples/design.toml

[colors]
band = "1F3A5F"     # 見出し帯・表ヘッダー・タイトルページの地色
accent = "E8A33D"   # アクセント（帯下の線、注意書きの帯）
text = "222222"     # 本文
sub = "777777"      # 補助テキスト（フッター、キャプション、目次のページ番号）
light = "DCE6F2"    # タイトルページの文字色など
code_bg = "F2F2F2"  # コードブロックの地色

[fonts]
heading = "Meiryo"  # 見出し帯・小見出し・タイトル
body = "Meiryo"     # 本文
mono = "Consolas"   # コード

[sizes]
title_band = 24     # 見出し帯の文字（pt）
body = 18           # 本文
subheading = 20     # 小見出し（===）
table = 14          # 表
code = 12.5         # コード
caption = 12        # 画像キャプション
footer = 10.5       # フッター

[page]
# slide_w = 13.333  # 横配置 16:9
# slide_h = 7.5
margin_x = 0.7      # 左右マージン（inch）
band_h = 1.0        # 見出し帯の高さ
content_top = 1.45  # 本文領域の上端
# content_bottom = 6.9  # 本文領域の下端（未指定時はスライド高さ - 0.6）
line_spacing = 1.3
line_factor = 1.2   # フォント固有の行高さの割り増し（実測系の目安）
